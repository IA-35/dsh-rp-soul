# dsh-rp-soulload bundle patch.
#
# Installed via `dsh plugin add dsh-rp-soulload`: the dsh plugin manager
# registers this package as a profile layer (dsh.bundle) and applies this
# patch, mounting the soul-persona plugin by package name. The cordis loader
# resolves `dsh-rp-soulload` from the profile's node_modules, so no manual
# file copying or path edits are needed.
#
# config.files 只是**首次运行时的种子**：一旦设置页保存过配置，
# 就会写进 $DSH_HOME/rp-soul/config.json，此后以那里为准。
- insert:
    - id: soul-persona
      name: 'dsh-rp-soulload'
      config:
        files:
          - SOUL.md
        maxBytes: 65536
