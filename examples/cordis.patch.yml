# 挂载示例：把以下内容附加到 $DSH_HOME\profiles\web\cordis.patch.yml
#
# name 以 ../ 开头 → loader 按 cordis.patch.yml 所在目录（profiles/web）向上解析，
# 指向 $DSH_HOME\profiles\plugins\soul-persona\lib\index.js
#
# 插件必须放在 profiles\plugins\（而非 profiles\web\plugins\）：
# 它的 ESM import 需要向上命中 profiles\node_modules 里的 @deepseek-ai/* 依赖。
#
# 多文件：files 按**数组顺序**拼接，顺序有意义（先说身份，再说口吻/禁忌）。
# 路径相对 $DSH_HOME，只接受 .md / .txt。
- insert:
    - id: soul-persona
      name: '../plugins/soul-persona/lib/index.js'
      config:
        files:
          - SOUL.md
        maxBytes: 65536
